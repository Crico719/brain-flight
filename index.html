            font-weight: bold;

    <div id="startOverlay">
        <h1>🧠 BRAIN FLIGHT</h1>
        <p>¡Responde las preguntas y salta los obstáculos!</p>
        <button class="space-btn" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{code:'Space'}))">PRESIONA SPACE PARA COMENZAR</button>
    </div>
    
	<script>
        (function() {
            //Initialization
            var game = new gdjs.RuntimeGame(gdjs.projectData, gdjs.runtimeGameOptions);

            //Create a renderer
            game.getRenderer().createStandardCanvas(document.body);

            //Bind keyboards/mouse/touch events
            game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);

            //Load all assets and start the game
            game.loadAllAssets(function() {
                game.startGameLoop();
            });

            // Start overlay: hide when Space is pressed
            var overlay = document.getElementById('startOverlay');
            if (overlay) {
                function hideOverlay() {
                    overlay.style.display = 'none';
                    document.removeEventListener('keydown', hideOverlay);
                    overlay.removeEventListener('click', hideOverlay);
                }
                document.addEventListener('keydown', function(e) {
                    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); hideOverlay(); }
                });
                overlay.addEventListener('click', hideOverlay);
            }
        })();

	</script>
